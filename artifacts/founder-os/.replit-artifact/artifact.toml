kind = "web"
previewPath = "/"
title = "Founder OS"
version = "1.0.0"
id = "artifacts/founder-os"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19291

[services.development]
run = "pnpm --filter @workspace/founder-os run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/founder-os", "run", "build" ]
serve = "static"
publicDir = "artifacts/founder-os/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19291"
BASE_PATH = "/"
